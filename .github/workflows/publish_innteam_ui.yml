# Constrói a imagem do InnTeam (Paperclip com a IDV do InnAgent), publica no GHCR
# e devolve a `ui-dist` como artifact.
#
# Por que existe: o build local na manager01 foi morto por falta de memória em 8 das 11
# tentativas de 08-09/09, mesmo com --memory, NODE_OPTIONS=1536 e nice -n 19. O runner
# tem a folga que ela não tem.
#
# 12/09/2026 — passou a PUBLICAR IMAGEM. Antes só o artifact da UI viajava, porque a
# produção rodava o pacote npm (`npx paperclipai@<versão>`) e o ExecStartPre trocava a
# `ui-dist` por cima. Esse arranjo era a dívida #1 do veredito de 05/09: versão resolvida
# em tempo de boot, 1,1 GB de cache npx no host e um hash de cache colado no unit. Agora a
# produção roda ESTA imagem, e a ui-dist continua saindo como artifact para quem precisar
# dela solta.
name: Publish InnTeam UI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch já com o tema aplicado (ex.: innagent-2026.817.0)'
        required: true
      tag:
        description: 'Versão do Paperclip (ex.: 2026.817.0)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/innagent-ai/paperclip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          build-args: PAPERCLIP_BUILD_VERSION=${{ inputs.tag }}-innagent
          push: false
          load: true
          tags: paperclip-innagent:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extrair a ui-dist
        run: |
          cid=$(docker create paperclip-innagent:${{ inputs.tag }})
          docker cp "$cid:/app/ui/dist" ./ui-dist
          docker rm "$cid" > /dev/null
          test -f ./ui-dist/index.html || { echo "ui-dist nao veio na imagem"; exit 1; }

      # Guarda do tema: sem isto o build fica verde entregando uma UI que compilou bem e
      # não tem a IDV. As três camadas que o InnTeam exigiu — tokens, paleta do Tailwind
      # e os hexes cravados em status-colors — são conferidas no CSS compilado.
      - name: Prova — a IDV do InnAgent está no CSS compilado
        run: |
          css=$(cat ./ui-dist/assets/*.css)
          falhas=0
          checa() {
            if echo "$css" | grep -qiF "$2"; then echo "ok   $1"
            else echo "FALTA $1 ($2)"; falhas=$((falhas+1)); fi
          }
          checa "fonte Lato"          "Lato"
          checa "tinta da marca"      "#292B2F"
          checa "fundo da marca"      "#EEF3F9"
          # as cores de fábrica não podem sobreviver ao tema
          for velha in "#F99C00" "#FB2C36" "#00A5EF" "#F59E0B" "#2563EB"; do
            if echo "$css" | grep -qiF "$velha"; then
              echo "SOBROU cor de fabrica: $velha"; falhas=$((falhas+1))
            fi
          done
          test "$falhas" = "0" || { echo "$falhas problema(s) no tema"; exit 1; }

      # Guarda do runtime: a produção passa a rodar a imagem, então os binários que os
      # agentes executam precisam estar DENTRO dela. Sem isto, um build verde derruba
      # todo run de agente por "command not found" só depois do deploy.
      - name: Prova — claude e codex existem na imagem
        run: |
          docker run --rm --entrypoint sh paperclip-innagent:${{ inputs.tag }} -c \
            'command -v claude && command -v codex && node --version'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag por VERSÃO (imutável, é a que a produção fixa) + `innagent-latest` por
      # conveniência. A produção nunca deve apontar para latest: ver o unit em
      # /etc/systemd/system/paperclip.service na worker01.
      - name: Publicar no GHCR
        run: |
          docker tag paperclip-innagent:${{ inputs.tag }} "$IMAGE:${{ inputs.tag }}-innagent"
          docker tag paperclip-innagent:${{ inputs.tag }} "$IMAGE:innagent-latest"
          docker push "$IMAGE:${{ inputs.tag }}-innagent"
          docker push "$IMAGE:innagent-latest"
          echo "publicado: $IMAGE:${{ inputs.tag }}-innagent"
          docker image inspect "$IMAGE:${{ inputs.tag }}-innagent" \
            --format 'digest={{index .RepoDigests 0}}' || true

      - uses: actions/upload-artifact@v4
        with:
          name: innteam-ui-${{ inputs.tag }}
          path: ui-dist
          retention-days: 5
